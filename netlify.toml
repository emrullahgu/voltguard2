[build]
  command = "node tools/build-netlify.cjs"
  publish = ".netlify-publish"

[build.environment]
  NODE_VERSION = "24"

# ---------------------------------------------------------------------------------------
# Tek adres: /index.html -> / ve /hizmetler/index.html -> /hizmetler/ (.htaccess ile ayni). Netlify kurallari
# yalnizca istemcinin istedigi yola uygulanir; "/" ve "/hizmetler/" icin dizin index.html dosyasinin sunulmasi
# kurallari yeniden calistirmaz, bu yuzden dongu olusmaz. "/hizmetler" -> "/hizmetler/" icin kural YAZILMAZ:
# Netlify kural eslemesinde sondaki "/" farkini yok sayar (kural kendine yonlenip dongu yaratirdi); klasor adresini
# Netlify kendisi index.html ile sunar.
# ---------------------------------------------------------------------------------------
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/hizmetler/index.html"
  to = "/hizmetler/"
  status = 301
  force = true

