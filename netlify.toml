# ---------------------------------------------------------------------------------------
# Guvenlik basliklari ve CSP. .htaccess (cPanel/Apache) ile ayni degerler; ikisi birlikte guncellenmeli.
# style-src/font-src yalnizca 'self' (+ data: font): yazi tipleri ve ikonlar kendi sunucumuzda; Google Fonts /
# Font Awesome CDN artik kullanilmiyor. script-src yalnizca jsPDF icin.
# ---------------------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'inline-speculation-rules' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; connect-src 'self' https://challenges.cloudflare.com; frame-src 'self' https://www.google.com https://www.google.com.tr https://maps.google.com https://challenges.cloudflare.com; upgrade-insecure-requests"

# ---------------------------------------------------------------------------------------
# Onbellek politikasi (.htaccess ile ayni). Netlify header kurallari sorgu dizesini (?v=) goremez:
# bu yuzden css/js burada her zaman 10 dk + must-revalidate'tir (.htaccess ?v= varsa 1 yil immutable verir).
# Netlify gzip/brotli'yi kendisi uygular. Kurallar birbiriyle cakismayacak sekilde ayri yollara yazildi.
# ---------------------------------------------------------------------------------------
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/hesaplama/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/hesaplama-araclari/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/hizmetler/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/araclar/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=600, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=600, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
