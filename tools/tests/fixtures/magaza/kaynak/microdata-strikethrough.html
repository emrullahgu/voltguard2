<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Sentetik microdata (üstü çizili fiyat)</title></head>
<body>
<div itemscope itemtype="https://schema.org/Product">
  <meta itemprop="name" content="Deneme Marka">
  <span itemprop="category" content="Otomatik Sigortalar"></span>
  <div itemprop='offers' itemscope itemtype='https://schema.org/Offer'>
    <meta itemprop='priceCurrency' content="TRY" />
    <meta itemprop='price' content="418.17" />
    <div itemprop="priceSpecification" itemscope itemtype="https://schema.org/UnitPriceSpecification">
      <meta itemprop="priceType" content="https://schema.org/StrikethroughPrice" />
      <meta itemprop="price" content="1550.78" />
      <meta itemprop="priceCurrency" content="TRY" />
    </div>
    <link itemprop='availability' href='https://schema.org/InStock'>
    <meta itemprop='itemCondition' content='http://schema.org/NewCondition' />
  </div>
</div>
</body></html>
