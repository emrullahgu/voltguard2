<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Sentetik: adet girdisi paket katı (data-market-price)</title></head>
<body>
<div itemscope itemtype="https://schema.org/Product">
  <h1 itemprop="name">Deneme Marka Kablo Etiketi</h1>
  <meta itemprop="sku" content="517008">
  <div itemprop="offers" itemscope itemtype="https://schema.org/Offer">
    <meta itemprop="priceCurrency" content="TRY"><meta itemprop="price" content="0.38">
    <link itemprop="availability" href="https://schema.org/InStock">
    <div class="product-price-container"><div class="product-price">0,38 TL <small>(KDV Dahil)</small></div></div>
  </div>
  <div class="product-cart-buttons">
    <div class="product-qty-wrapper">
      <div class="product-qty" data-selector="qty-wrapper-2" data-market-price="500">
        <a href="javascript:void(0)" data-selector="decrease-qty-2" aria-label="Decrease Quantity">-</a>
        <div><input type="text" id="qty-input-2" name="quantity" value="500" class="qty-input"></div>
        <a href="javascript:void(0)" data-selector="increase-qty-2" aria-label="Increase Quantity">+</a>
      </div>
    </div>
    <button class="btn add-to-cart">Sepete Ekle</button>
  </div>
</div>
</body></html>
