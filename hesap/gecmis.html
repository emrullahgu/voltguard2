<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a1628">
  <meta name="color-scheme" content="light only">
  <meta name="robots" content="noindex, nofollow">
  <title>Geçmiş Hesaplamalar | VoltGuard Tools</title>
  <link rel="icon" type="image/png" href="../public/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="../public/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="doc-shell">
  <header class="doc-header">
    <div class="doc-header__inner">
      <a class="doc-header__brand" href="../index.html"><img src="../public/icon-192.png" alt="">VoltGuard</a>
      <nav class="doc-header__nav" aria-label="Üst menü">
        <a href="../bilgi-bankasi.html">Bilgi Bankası</a>
        <a href="../akademi.html">Akademi</a>
        <a href="../teklif-araclari.html">Tools</a>
        <a href="../sor.html">VoltGuard'a Sor</a>
      </nav>
    </div>
  </header>

  <main class="vg-panel">
    <aside class="vg-panel__nav" aria-label="Hesap menüsü">
      <a href="panel.html"><i class="fas fa-gauge-high"></i> Panel</a>
      <a href="gecmis.html" class="is-active"><i class="fas fa-clock-rotate-left"></i> Geçmiş Hesaplamalar</a>
      <a href="favoriler.html"><i class="fas fa-star"></i> Favori Araçlar</a>
      <a href="projeler.html"><i class="fas fa-folder-tree"></i> Projeler</a>
      <a href="dokumanlar.html"><i class="fas fa-book-open"></i> Dokümanlarım</a>
      <button type="button" class="vg-panel__logout" id="logout-btn"><i class="fas fa-arrow-right-from-bracket"></i> Çıkış yap</button>
    </aside>

    <section class="vg-panel__main">
      <div class="vg-section">
        <h2><i class="fas fa-clock-rotate-left"></i> Kayıtlı hesaplamalarınız</h2>
        <p style="color:var(--clr-text-muted);margin:.35rem 0 1rem">Her hesap için giriş değerleri ve sonuç saklanır. Detayları görmek için satırı açın; projelere bağlayabilirsiniz.</p>
        <div id="history-list" class="vg-history-list"></div>
      </div>
    </section>
  </main>

  <script src="../js/voltguard-auth.js"></script>
  <script>
    (function () {
      'use strict';
      var Auth = window.VG.Auth;
      var user = Auth.requireAuth('giris.html');
      if (!user) return;

      document.getElementById('logout-btn').addEventListener('click', function () {
        if (confirm('Çıkış yapmak istediğinize emin misiniz?')) { Auth.logout(); location.href = '../index.html'; }
      });

      var list = document.getElementById('history-list');

      function render() {
        var items = Auth.getHistory();
        if (!items.length) {
          list.innerHTML = '<div class="vg-empty">Henüz kayıtlı hesap yok. <a href="../teklif-araclari.html">Hesaplama Merkezi</a>\'nden bir araç açıp "Hesabıma kaydet" butonuna basın.</div>';
          return;
        }
        var projects = Auth.getProjects();
        list.innerHTML = items.map(function (h) { return renderItem(h, projects); }).join('');
        bindEvents();
      }

      function renderItem(h, projects) {
        var when = new Date(h.savedAt).toLocaleString('tr-TR');
        var paramsHtml = (h.params || []).map(function (p) {
          return '<div style="font-size:.85rem;color:var(--clr-text-muted)">' + esc(p.label) + ': <strong style="color:var(--clr-dark)">' + esc(p.value) + '</strong></div>';
        }).join('');
        var projOptions = '<option value="">Projeye ekle…</option>' + projects.map(function (p) {
          return '<option value="' + escAttr(p.id) + '">' + esc(p.name) + '</option>';
        }).join('');
        return '<details class="vg-history-item"><summary style="cursor:pointer;list-style:none">'
          + '<h3>' + esc(h.toolName) + '</h3>'
          + '<div class="vg-history-item__meta">' + esc(when) + '</div>'
          + '<div class="vg-history-item__value">' + esc(h.result && h.result.value || '-') + '</div>'
          + '</summary>'
          + '<div style="margin-top:.75rem;display:grid;gap:.35rem">' + paramsHtml + '</div>'
          + (h.result && h.result.note ? '<p style="margin-top:.6rem;font-size:.88rem;color:var(--clr-text-muted)">' + esc(h.result.note) + '</p>' : '')
          + '<div class="vg-history-item__actions">'
          +   '<a class="vg-mini-btn" href="' + escAttr(h.toolUrl || '#') + '"><i class="fas fa-arrow-up-right-from-square"></i> Aracı yeniden aç</a>'
          +   '<select class="vg-mini-btn" data-attach="' + escAttr(h.id) + '" style="cursor:pointer">' + projOptions + '</select>'
          +   '<button type="button" class="vg-mini-btn vg-mini-btn--danger" data-delete="' + escAttr(h.id) + '"><i class="fas fa-trash"></i> Sil</button>'
          + '</div>'
          + '</details>';
      }

      function bindEvents() {
        list.querySelectorAll('[data-delete]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            if (confirm('Bu hesap kaydını silmek istediğinize emin misiniz?')) {
              Auth.deleteHistory(btn.getAttribute('data-delete'));
              render();
            }
          });
        });
        list.querySelectorAll('[data-attach]').forEach(function (sel) {
          sel.addEventListener('change', function () {
            if (!sel.value) return;
            Auth.attachCalcToProject(sel.value, sel.getAttribute('data-attach'));
            alert('Projeye eklendi.');
            sel.value = '';
          });
        });
      }

      function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
      function escAttr(s) { return esc(s); }

      render();
    }());
  </script>
</body>
</html>
