---
deployment:
  tasks:
    # Deploy hedefi - birincil alan adi kok dizini (cPanel kullanici voltgua2).
    # ONEMLI - cPanel deploy gorev listesi YAML olarak ayristirilir; bir gorev
    # satirinda iki-nokta+bosluk iceren komut (eski Turnstile echo uyarisi gibi)
    # ayristirmayi bozar ve deploy'u sessizce durdururdu. Gorev satirlarina iki-nokta+bosluk YAZMAYIN.
    # Turnstile gizli anahtari (TURNSTILE_SECRET_KEY) sunucuda ortam degiskeni olarak set edilir; herkese acik
    # site anahtari index.html icinde depoda tutulur (her deploy index.html dosyasinin uzerine yazar).
    #
    # SIRALAMA (guvenli deploy)
    #  1) Statik varliklar (fonts, css, js, assets, public) - HTML'den ONCE. Sayfalar css/js'i ?v=<surum> ile ister
    #     ve sunucu bunlari 1 yil "immutable" verir. HTML once yayinlanirsa bir ziyaretci yeni ?v= adresinden
    #     ESKI dosyayi alip bir yil onbellekte tutabilirdi.
    #  2) api/ (sunucu kodu) - onu cagiran hesap sayfalarindan once.
    #  3) Icerik klasorleri (bilgi, hizmetler, akademi, sor, mm, hesap, hesaplama).
    #  4) Kok sayfalar ve dosyalar; erisim kurallari ilk adimda kurulup sonda tekrar kopyalanir ve
    #     en son sw.js (yeni service worker kurulurken her sey yerinde olsun).
    #  Ozel API/calisan staging docroot disindadir; erisim kurallari ozel dosyalardan ONCE etkinlesir.
    # Klasorler once .new olarak kopyalanir, sonra eskisi silinip yeniden adlandirilir. Kaynak eksikse ya da kopyalama
    # yarida kesilirse canli klasore dokunulmaz; silme ile yeniden adlandirma arasindaki bosluk milisaniyelerdir.
    # Yeniden adlandirilan/silinen dosyalar sunucuda kalmaz. tools/, txt/ ve .git bilerek DEPLOY EDILMEZ.
    # Runtime veri (kullanici, oturum) docroot DISINDA tutulur; _vgdata/ ve vg-data/ klasorlerine hicbir gorev dokunmaz.
    - export DEPLOYPATH=/home/voltgua2/public_html/
    - export VG_STAGEPATH=/home/voltgua2/vg-deploy-stage/
    - /bin/mkdir -p $VG_STAGEPATH
    # Sozdizimi hatali PHP canliya gitmesin. php komutu bulunamazsa adim atlanir, hata bulursa deploy burada durur.
    - if command -v php >/dev/null 2>&1; then for f in api/*.php api/lib/*.php contact.php calisan/index.php calisan/uygulama/index.php calisan/uygulama/saha.php volthaber/index.php; do php -l "$f" >/dev/null || exit 1; done; fi
    # Install private URL protection before any private file is copied into the web root.
    - /bin/cp .htaccess $DEPLOYPATH
    # ----- 1) Statik varliklar -----
    # fonts/ kendi barindirdigimiz yazi tipleri ve ikon fontu (hash li dosya adlari; css/fa-subset.css bunlara bagli).
    - /bin/rm -rf $DEPLOYPATH/fonts.new
    - /bin/cp -R fonts $DEPLOYPATH/fonts.new
    - /bin/rm -rf $DEPLOYPATH/fonts
    - /bin/mv $DEPLOYPATH/fonts.new $DEPLOYPATH/fonts
    - /bin/rm -rf $DEPLOYPATH/css.new
    - /bin/cp -R css $DEPLOYPATH/css.new
    - /bin/rm -rf $DEPLOYPATH/css
    - /bin/mv $DEPLOYPATH/css.new $DEPLOYPATH/css
    - /bin/rm -rf $DEPLOYPATH/js.new
    - /bin/cp -R js $DEPLOYPATH/js.new
    - /bin/rm -rf $DEPLOYPATH/js
    - /bin/mv $DEPLOYPATH/js.new $DEPLOYPATH/js
    - /bin/rm -rf $DEPLOYPATH/assets.new
    - /bin/cp -R assets $DEPLOYPATH/assets.new
    - /bin/rm -rf $DEPLOYPATH/assets
    - /bin/mv $DEPLOYPATH/assets.new $DEPLOYPATH/assets
    - /bin/rm -rf $DEPLOYPATH/public.new
    - /bin/cp -R public $DEPLOYPATH/public.new
    - /bin/rm -rf $DEPLOYPATH/public
    - /bin/mv $DEPLOYPATH/public.new $DEPLOYPATH/public
    # ----- 2) api/ -----
    # api/ yalnizca KOD icerir (php). api/ icine veri YAZMAYIN; her deploy bu klasoru yeniden olusturur.
    - /bin/rm -rf $VG_STAGEPATH/api.new
    - /bin/cp -R api $VG_STAGEPATH/api.new
    - /bin/rm -rf $DEPLOYPATH/api
    - /bin/mv $VG_STAGEPATH/api.new $DEPLOYPATH/api
    # ----- 3) Icerik klasorleri -----
    - /bin/rm -rf $DEPLOYPATH/bilgi.new
    - /bin/cp -R bilgi $DEPLOYPATH/bilgi.new
    - /bin/rm -rf $DEPLOYPATH/bilgi
    - /bin/mv $DEPLOYPATH/bilgi.new $DEPLOYPATH/bilgi
    # hizmetler/ hizmet sayfalari; /hizmetler/ adresi hizmetler/index.html dosyasini sunar (.htaccess).
    - /bin/rm -rf $DEPLOYPATH/hizmetler.new
    - /bin/cp -R hizmetler $DEPLOYPATH/hizmetler.new
    - /bin/rm -rf $DEPLOYPATH/hizmetler
    - /bin/mv $DEPLOYPATH/hizmetler.new $DEPLOYPATH/hizmetler
    - /bin/rm -rf $DEPLOYPATH/akademi.new
    - /bin/cp -R akademi $DEPLOYPATH/akademi.new
    - /bin/rm -rf $DEPLOYPATH/akademi
    - /bin/mv $DEPLOYPATH/akademi.new $DEPLOYPATH/akademi
    - /bin/rm -rf $DEPLOYPATH/sor.new
    - /bin/cp -R sor $DEPLOYPATH/sor.new
    - /bin/rm -rf $DEPLOYPATH/sor
    - /bin/mv $DEPLOYPATH/sor.new $DEPLOYPATH/sor
    - /bin/rm -rf $DEPLOYPATH/mm.new
    - /bin/cp -R mm $DEPLOYPATH/mm.new
    - /bin/rm -rf $DEPLOYPATH/mm
    - /bin/mv $DEPLOYPATH/mm.new $DEPLOYPATH/mm
    - /bin/rm -rf $DEPLOYPATH/hesap.new
    - /bin/cp -R hesap $DEPLOYPATH/hesap.new
    - /bin/rm -rf $DEPLOYPATH/hesap
    - /bin/mv $DEPLOYPATH/hesap.new $DEPLOYPATH/hesap
    # Employee pages include a PHP authorization gate; runtime staff data is never copied.
    - /bin/rm -rf $VG_STAGEPATH/calisan.new
    - /bin/cp -R calisan $VG_STAGEPATH/calisan.new
    - /bin/rm -rf $DEPLOYPATH/calisan
    - /bin/mv $VG_STAGEPATH/calisan.new $DEPLOYPATH/calisan
    - /bin/rm -rf $DEPLOYPATH/hesaplama.new
    - /bin/cp -R hesaplama $DEPLOYPATH/hesaplama.new
    - /bin/rm -rf $DEPLOYPATH/hesaplama
    - /bin/mv $DEPLOYPATH/hesaplama.new $DEPLOYPATH/hesaplama
    # Public engineering build only; tools/engineering and the original import are not deployed.
    - /bin/rm -rf $DEPLOYPATH/araclar.new
    - /bin/cp -R araclar $DEPLOYPATH/araclar.new
    - /bin/rm -rf $DEPLOYPATH/araclar
    - /bin/mv $DEPLOYPATH/araclar.new $DEPLOYPATH/araclar
    # VoltSim 3D simulasyon sayfalari; /voltsim/ ve /voltsim/<modul>/ adresleri index.html sunar (.htaccess).
    - /bin/rm -rf $DEPLOYPATH/voltsim.new
    - /bin/cp -R voltsim $DEPLOYPATH/voltsim.new
    - /bin/rm -rf $DEPLOYPATH/voltsim
    - /bin/mv $DEPLOYPATH/voltsim.new $DEPLOYPATH/voltsim
    # VoltHaber; /volthaber/ ve alt adresleri volthaber/index.php sunucu tarafinda uretir (.htaccess).
    - /bin/rm -rf $DEPLOYPATH/volthaber.new
    - /bin/cp -R volthaber $DEPLOYPATH/volthaber.new
    - /bin/rm -rf $DEPLOYPATH/volthaber
    - /bin/mv $DEPLOYPATH/volthaber.new $DEPLOYPATH/volthaber
    # ----- 4) Kok dosyalar -----
    # Kokteki tum .html sayfalari tek gorevle (index.html, 404.html, fabrika-cozumleri.html ... yeni kok sayfalar dahil).
    # Yeni kok sayfa icin AYRI cp satiri YAZMAYIN; dosya depoda yoksa cp hata verip deploy'u o noktada durdurur.
    - /bin/cp -R *.html $DEPLOYPATH
    - /bin/cp -R contact.php $DEPLOYPATH
    - /bin/cp -R manifest.json $DEPLOYPATH
    - /bin/cp -R robots.txt $DEPLOYPATH
    - /bin/cp -R llms.txt $DEPLOYPATH
    - /bin/cp -R sitemap.xml $DEPLOYPATH
    - /bin/cp -R .htaccess $DEPLOYPATH
    - /bin/cp -R sw.js $DEPLOYPATH
