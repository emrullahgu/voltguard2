<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a1628">
  <meta name="color-scheme" content="light only">
  <meta name="robots" content="noindex, follow">
  <title>Sayfa Bulunamadı (404) | VoltGuard</title>
  <link rel="icon" type="image/png" href="/public/favicon-32.png" sizes="32x32">
  <style>
    :root { color-scheme: light; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #0a1628 0%, #132742 100%);
      color: #e6edf5;
      text-align: center;
    }
    .e404 { max-width: 540px; }
    .e404__logo {
      width: 96px; height: 96px;
      border-radius: 22px;
      margin: 0 auto 1.75rem;
      display: block;
      box-shadow: 0 18px 48px rgba(0, 0, 0, .45);
    }
    .e404__code {
      font-size: clamp(4rem, 16vw, 7rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -.04em;
      background: linear-gradient(90deg, #f59e0b, #fbbf24);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .e404__title { font-size: 1.6rem; font-weight: 700; margin: .75rem 0 .5rem; }
    .e404__text { color: #9fb3c8; line-height: 1.6; margin-bottom: 2rem; }
    .e404__btn {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .85rem 1.75rem;
      border-radius: 12px;
      background: #f59e0b;
      color: #0a1628;
      font-weight: 700;
      text-decoration: none;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .e404__btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(245, 158, 11, .35); }
    .e404__btn:focus-visible { outline: 3px solid #fbbf24; outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) {
      .e404__btn { transition: none; }
      .e404__btn:hover { transform: none; }
    }
  </style>
</head>
<body>
  <main class="e404">
    <img class="e404__logo" src="/public/icon-192.png" alt="VoltGuard" width="96" height="96">
    <div class="e404__code">404</div>
    <h1 class="e404__title">Aradığınız sayfa bulunamadı</h1>
    <p class="e404__text">
      Bağlantı taşınmış, silinmiş ya da adres yanlış yazılmış olabilir.
      Ana sayfaya dönerek hizmetlerimize ulaşabilirsiniz.
    </p>
    <a class="e404__btn" href="/">&larr; Ana Sayfaya Dön</a>
  </main>
</body>
</html>
